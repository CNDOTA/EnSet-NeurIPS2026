# --- EnSet-QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000  # default is 50000 

runner: "episode"
# runner: "parallel"
# batch_size_run: 8

buffer_size: 5000  # default is 5000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
agent_output_type: "q"
learner: "enset_q_learner"
double_q: True
mixer: "eqmix"
mixing_embed_dim: 32  # default is 32
hypernet_layers: 2  # default is 2
hypernet_embed: 64  # default is 64

rnn_hidden_dim: 64  # default is 64

replay_ratio: 10

reset_mode: 'shrink_and_perturb'
reset_interval: 2000
reset_mixer_alpha: 0.8  # keep alpha% parameters
reset_agent_alpha: 0.8  # keep alpha% parameters

random_amplitude_scaling: False
random_amplitude_scale_and_perturb: True  # multiagent translation augmentation
perturb_alpha: 0.2
random_amplitude_scale_and_agent_permutating: False

mixer_ensemble_N: 5

name: "enset_qmix"

