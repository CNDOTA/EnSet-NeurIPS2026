# --- EnSet-QMIX (SMACv2) specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000 # 500000 for 6h_vs_8z

runner: "parallel"
batch_size_run: 8  # batch_size_run=4, buffer_size = 2500, batch_size=64  for 3s5z_vs_3s6z
# runner: "episode"
buffer_size: 5000 
batch_size: 128
# optimizer: 'adam'

t_max: 1050000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "n_mac"
agent: "n_rnn"
agent_output_type: q

learner: "enset_nq_learner"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001 # Learning rate for agents
td_lambda: 0.6 # 0.3 for 6h_vs_8z
optimizer: 'adam'
q_lambda: False

replay_ratio: 15

reset_mode: 'shrink_and_perturb'  # 'shrink_and_perturb', 'hard'
reset_interval: 2000
reset_mixer_alpha: 0.8  # keep alpha% parameters
reset_agent_alpha: 0.8  # keep alpha% parameters

random_amplitude_scaling: False
random_amplitude_scale_and_perturb: True  # multiagent translation augmentation
perturb_alpha: 0.2

mixer_ensemble_N: 5

run: "enset_run"

name: "enset_qmix"

